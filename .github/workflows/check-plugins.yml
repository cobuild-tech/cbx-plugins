name: Check plugins
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shared references are in sync
        run: scripts/sync-shared.sh --check
      - name: Every reference is routed from SKILL.md
        run: scripts/check-references.sh
